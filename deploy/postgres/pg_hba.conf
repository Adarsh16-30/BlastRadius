# scram-sha-256 from the Compose subnet and nothing else (PRD 9). The subnet must match
# networks.default in deploy/compose.yaml. `local` is the Unix socket inside the container,
# used by the entrypoint, healthcheck and `docker exec`; it also needs a password.
# TYPE  DATABASE     USER    ADDRESS          METHOD
local   all          all                      scram-sha-256
# Superusers: repmgr only between the two nodes (fixed addresses in compose.yaml); postgres only
# from the Docker host (bridge gateway, `make itest`). Every other container gets a reject.
host    all          repmgr           172.30.77.201/32  scram-sha-256
host    all          repmgr           172.30.77.202/32  scram-sha-256
host    replication  repmgr           172.30.77.201/32  scram-sha-256
host    replication  repmgr           172.30.77.202/32  scram-sha-256
host    all          postgres         172.30.77.1/32    scram-sha-256
host    all          postgres,repmgr  0.0.0.0/0         reject
host    all          all              172.30.77.0/24    scram-sha-256
