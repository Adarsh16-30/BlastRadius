# Included from $PGDATA/postgresql.conf (the entrypoint appends the include line at initdb).
# PRD 4 memory settings and PRD 6.4 replication settings. PostgreSQL 17 docs:
# https://www.postgresql.org/docs/17/runtime-config.html
listen_addresses = '*'
hba_file = '/etc/postgresql/pg_hba.conf'
password_encryption = scram-sha-256

shared_buffers = 32MB
work_mem = 2MB
maintenance_work_mem = 16MB
max_connections = 30

wal_level = replica
hot_standby = on
wal_log_hints = on          # pg_rewind (data checksums are on as well)
max_wal_senders = 5
max_replication_slots = 5
wal_keep_size = 256MB
max_slot_wal_keep_size = 1GB   # a dead standby's slot must not fill the disk; past this it re-clones
synchronous_standby_names = ''   # asynchronous by design (PRD 12.1)

archive_mode = on
# shortcut: WAL is discarded until M5 replaces this with `pgbackrest archive-push`.
archive_command = '/bin/true'

shared_preload_libraries = 'repmgr'   # required by repmgrd
