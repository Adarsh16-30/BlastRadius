# Services not yet built still run a pinned busybox placeholder; the target image is
# named in each comment and swapped in by the milestone that owns it.
# M1 swapped in real images for haproxy, api1/api2, toxiproxy and k6; M2 for pg1/pg2. Tags were
# each checked with `docker manifest inspect` on 2026-11-15:
#   postgres:17.9-bookworm (deploy/postgres/Dockerfile)  haproxy:3.4.7-alpine3.24  ghcr.io/shopify/toxiproxy:2.13.0
#   grafana/k6:2.4.0          golang:1.27.4-alpine3.24 (API builder, deploy/api/Dockerfile)
# Placeholder targets (prometheus, grafana, ...) are still unverified (docs/QUESTIONS.md).
name: blastradius

x-base: &base
  image: busybox:1.37.0
  command: ["sleep", "infinity"]
  user: "65534:65534"
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  restart: unless-stopped
  healthcheck:
    test: ["CMD", "true"] # shortcut: placeholder check, real per-service checks arrive with real images
    interval: 10s
    timeout: 3s
    retries: 3

x-api: &api
  <<: *base
  image: ghcr.io/adarsh16-30/blastradius-api:dev
  build:
    context: ..
    dockerfile: deploy/api/Dockerfile
  command: []
  user: "65532:65532"
  environment:
    DB_HOSTS: toxiproxy:15432,toxiproxy:15433 # both application pools go through Toxiproxy (PRD 6.6)
    DB_NAME: blastradius
    DB_USER: app
    DB_PASSWORD: ${APP_PASSWORD:?set APP_PASSWORD in .env}
    CHAOS_ENABLED: ${CHAOS_ENABLED:-false}
    GOMEMLIMIT: 48MiB # 75% of mem_limit (PRD 2)
  healthcheck:
    test: ["CMD", "/api", "healthcheck"]
    interval: 5s
    timeout: 3s
    retries: 3
    start_period: 5s
  depends_on:
    migrate: { condition: service_completed_successfully }
    toxiproxy: { condition: service_healthy }
  mem_limit: 64m
  mem_reservation: 32m
  pids_limit: 64

# One image for both nodes (deploy/postgres); they differ only by environment (PRD 6.4).
# Base postgres:17.9-bookworm verified with `docker manifest inspect` on 2026-11-15.
x-pg: &pg
  <<: *base
  image: ghcr.io/adarsh16-30/blastradius-postgres:dev
  build:
    context: ./postgres
  command: []
  user: "999:999" # postgres uid in the Debian image
  stop_grace_period: 30s # entrypoint runs `pg_ctl stop -m fast` on SIGTERM
  tmpfs: ["/tmp:size=16m", "/run/postgresql:size=1m"]
  healthcheck: # /tmp/ready: roles exist and the node is registered with repmgr
    test: ["CMD-SHELL", "test -f /tmp/ready && pg_isready -q -U probe -d blastradius"]
    interval: 5s
    timeout: 3s
    retries: 3
    start_period: 60s
  mem_limit: 256m
  mem_reservation: 128m
  pids_limit: 128

x-pg-env: &pg-env
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
  REPMGR_PASSWORD: ${REPMGR_PASSWORD:?set REPMGR_PASSWORD in .env}
  APP_PASSWORD: ${APP_PASSWORD:?set APP_PASSWORD in .env}
  MIGRATOR_PASSWORD: ${MIGRATOR_PASSWORD:?set MIGRATOR_PASSWORD in .env}
  PROBE_PASSWORD: ${PROBE_PASSWORD:?set PROBE_PASSWORD in .env}

services:
  haproxy:
    <<: *base
    image: haproxy:3.4.7-alpine3.24
    command: ["haproxy", "-f", "/usr/local/etc/haproxy/haproxy.cfg"]
    volumes: ["./haproxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro"]
    ports: ["127.0.0.1:8080:8080"]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8404/haproxy-health"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 5s
    depends_on:
      api1: { condition: service_healthy }
      api2: { condition: service_healthy }
    mem_limit: 32m
    mem_reservation: 16m
    pids_limit: 64
  api1:
    <<: *api
  api2:
    <<: *api
  migrate: # one-shot: applies db/migrations as the migrator role, then exits
    <<: *api
    command: ["migrate"]
    restart: "no"
    environment:
      # Direct, not via Toxiproxy: faults must not hit migrations. The read-write node is used.
      MIGRATE_DB_HOST: pg1:5432,pg2:5432
      MIGRATE_DB_USER: migrator
      MIGRATE_DB_PASSWORD: ${MIGRATOR_PASSWORD:?set MIGRATOR_PASSWORD in .env}
      DB_NAME: blastradius
    healthcheck:
      test: ["CMD", "/api", "version"] # shortcut: exits immediately, the check only satisfies the every-service rule
    depends_on:
      pg1: { condition: service_healthy }
      pg2: { condition: service_healthy }
    mem_limit: 32m
    mem_reservation: 16m
  toxiproxy:
    <<: *base
    image: ghcr.io/shopify/toxiproxy:2.13.0
    command: ["-host=0.0.0.0", "-config=/config/proxies.json"]
    volumes: ["./toxiproxy/proxies.json:/config/proxies.json:ro"]
    healthcheck:
      test: ["CMD", "/toxiproxy-cli", "list"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 3s
    mem_limit: 32m
    mem_reservation: 16m
    pids_limit: 64
  pg1:
    <<: *pg
    environment:
      <<: *pg-env
      NODE_ID: "1"
      NODE_NAME: pg1
      PEER_HOST: pg2
      PG_ROLE: primary
    volumes: ["pg1-data:/var/lib/postgresql/data"]
  pg2:
    <<: *pg
    environment:
      <<: *pg-env
      NODE_ID: "2"
      NODE_NAME: pg2
      PEER_HOST: pg1
      PG_ROLE: standby
    volumes: ["pg2-data:/var/lib/postgresql/data"]
    # No depends_on between the nodes: after a failover pg1 is the standby and must not gate pg2.
  prometheus: # target: prom/prometheus 3.15.1
    <<: *base
    mem_limit: 160m
    mem_reservation: 96m
    pids_limit: 64
  grafana: # target: grafana/grafana-oss 13.3.0
    <<: *base
    ports: ["127.0.0.1:3000:3000"]
    mem_limit: 192m
    mem_reservation: 96m
    pids_limit: 64
  dockerproxy: # target: tecnativa/docker-socket-proxy (socket mounted read-only in M4)
    <<: *base
    mem_limit: 32m
    mem_reservation: 16m
    pids_limit: 64
  cloudflared: # target: cloudflare/cloudflared, Quick Tunnel
    <<: *base
    profiles: [public]
    mem_limit: 48m
    mem_reservation: 24m
    pids_limit: 64
  blast: # target: ghcr.io/adarsh16-30/blastradius-blast (M4)
    <<: *base
    profiles: [chaos]
    mem_limit: 64m
    mem_reservation: 32m
    pids_limit: 64
  k6: # run with: make baseline  (docker compose run --rm k6 run /load/steady.js)
    <<: *base
    image: grafana/k6:2.4.0
    profiles: [chaos]
    entrypoint: ["k6"]
    command: ["version"]
    user: "12345:12345"
    volumes: ["../load:/load:ro"]
    environment:
      BASE_URL: http://haproxy:8080
    healthcheck:
      test: ["CMD", "k6", "version"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: "no"
    mem_limit: 128m
    mem_reservation: 64m
    pids_limit: 64

volumes:
  pg1-data:
  pg2-data:

# Fixed subnet so deploy/postgres/pg_hba.conf can allow exactly this network (PRD 9).
networks:
  default:
    ipam:
      config:
        - subnet: 172.30.77.0/24
