# HAProxy 3.4.7 (image haproxy:3.4.7-alpine3.24, tag verified with docker manifest inspect).
# Docs: https://docs.haproxy.org/3.4/configuration.html
# Validated in this repo with `haproxy -c` (see docs/evidence/M1.md).
global
    log stdout format raw local0
    maxconn 512
    # normalize-uri is flagged experimental in 3.4; needed so the /debug deny cannot be bypassed by %-encoding.
    expose-experimental-directives

defaults
    mode http
    log global
    option httplog
    timeout connect 1s
    timeout server  3s
    timeout client  5s
    retries 2
    option redispatch

resolvers docker
    nameserver dns 127.0.0.11:53
    resolve_retries 3
    timeout resolve 1s
    timeout retry   1s
    hold valid 5s

frontend public
    bind :8080
    # Decode %64ebug etc. first: Go's mux matches the decoded path, so the deny must too.
    http-request normalize-uri percent-decode-unreserved
    http-request normalize-uri path-merge-slashes
    # PRD 6.3: chaos and metrics routes are never reachable from the edge.
    http-request deny deny_status 403 if { path_beg /debug/ } || { path_beg /metrics }
    default_backend api

backend api
    balance roundrobin
    # Replaying a POST is safe: idempotency keys and (writer_id, seq) are unique.
    retry-on conn-failure empty-response
    option httpchk
    http-check send meth GET uri /healthz
    default-server check inter 2s fall 2 rise 2 resolvers docker init-addr none
    server api1 api1:8080
    server api2 api2:8080

# Internal-only listener: container healthcheck and the built-in Prometheus exporter.
frontend internal
    bind :8404
    monitor-uri /haproxy-health
    http-request use-service prometheus-exporter if { path /metrics }
