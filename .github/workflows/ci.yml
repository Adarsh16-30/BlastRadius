name: ci
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # shortcut: actions pinned by major tag, not commit SHA (PRD 9); SHAs could not be
      # resolved offline in M0. Pin them in M7 with the security-reviewer pass.
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.4"
      # Real Postgres for the store integration tests, with a random password per run (PRD 9).
      # Tag verified with docker manifest inspect.
      - name: Start Postgres
        run: |
          pw=$(openssl rand -hex 16)
          echo "::add-mask::$pw"
          docker run -d --name pg -p 127.0.0.1:5432:5432 -e POSTGRES_PASSWORD="$pw" postgres:17.9-alpine3.23
          echo "TEST_DATABASE_URL=postgres://postgres:${pw}@127.0.0.1:5432/postgres" >> "$GITHUB_ENV"
          for _ in $(seq 30); do docker exec pg pg_isready -U postgres && exit 0; sleep 1; done
          exit 1
      - run: go vet ./...
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.15.0
      - run: go test -race -cover ./...
      - run: docker build -f deploy/api/Dockerfile -t blastradius-api:ci .
      - run: docker build -t blastradius-postgres:ci deploy/postgres
      - run: shellcheck deploy/postgres/entrypoint.sh scripts/pgstatus.sh scripts/failover-drill.sh scripts/stale-primary-drill.sh scripts/smoke.sh
      - run: docker compose -f deploy/compose.yaml --env-file .env.example config --quiet
